name: golden

# Gates the demo golden lock: pins the shipped Cinderhaven demo per-partner bounce
# counts (the case-study figures) so the deployed demo cannot drift during the
# client-mode conversion. Runs ONLY the golden (tests_golden.py) against the real
# audit engine — base deps only (pydantic + pyyaml + pytest), never
# lailara_engagement.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        run: pip install -e ".[dev]"
      - name: Demo golden lock
        run: python -m pytest tests_golden.py -q
